<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>REDCASE v3.2 — PRO EDITION</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Arial,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#050505; --panel:#111; --line:#2a2a2a;
    --red:#ff0033; --white:#fff; --muted:#777;
    --common:#4b69ff; --uncommon:#8847ff; --rare:#d32ce6; --epic:#eb4b4b; --legend:#ffd700;
  }
  body{background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(circle at 50% 0%,rgba(255,0,51,.12),transparent 50%);
    padding-bottom:80px}

  /* SPLASH */
  #splash-screen{position:fixed;inset:0;background:#050505;z-index:9999;display:flex;
    flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.5s;cursor:pointer}
  .splash-logo{font-size:40px;font-weight:900;letter-spacing:3px;margin-bottom:20px}
  .splash-logo span{color:var(--red);text-shadow:0 0 20px var(--red)}
  .splash-text{font-size:14px;color:#888;letter-spacing:2px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}100%{opacity:.5;transform:scale(.95)}}

  /* HEADER */
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;
    border-bottom:2px solid var(--red);background:rgba(0,0,0,.9);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:100}
  .logo{font-size:22px;font-weight:900;letter-spacing:2px}
  .logo span{color:var(--red);text-shadow:0 0 15px var(--red)}
  .user-info{display:flex;align-items:center;gap:10px}
  .lvl-box{background:#111;border:1px solid #ffd700;padding:4px 10px;border-radius:8px;
    font-size:12px;font-weight:900;color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.2)}
  .balance{display:flex;align-items:center;gap:8px;background:#111;border:1px solid var(--red);
    padding:6px 14px;border-radius:8px;font-size:16px;font-weight:800;
    box-shadow:0 0 15px rgba(255,0,51,.2);transition:.2s}
  .balance.flash{background:var(--red);color:#000}

  /* PAGES */
  .page{display:none;padding:20px 15px;max-width:800px;margin:0 auto}
  .page.active{display:block;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2{text-align:center;font-size:22px;margin-bottom:20px;letter-spacing:1px;text-transform:uppercase}
  h2 span{color:var(--red);text-shadow:0 0 10px var(--red)}

  /* BOTTOM NAV */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);
    backdrop-filter:blur(10px);border-top:1px solid #222;display:flex;justify-content:space-around;
    padding:10px 5px 15px;z-index:100}
  nav button{background:none;border:none;color:#666;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;
    transition:all .2s;cursor:pointer;padding:5px;flex:1}
  nav button svg{width:24px;height:24px;fill:currentColor;transition:.2s}
  nav button.active{color:var(--red);text-shadow:0 0 10px rgba(255,0,51,.5)}
  nav button.active svg{filter:drop-shadow(0 0 8px var(--red))}
  nav button:active{transform:scale(.9)}

  /* CASES */
  .cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .case-card{background:linear-gradient(180deg,#1a1a1a,#0b0b0b);border:2px solid #222;
    border-radius:14px;padding:15px 8px;text-align:center;cursor:pointer;transition:all .2s;
    display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
  .case-card:active{transform:scale(.95)}
  .case-card:hover{border-color:var(--red);box-shadow:0 10px 30px rgba(255,0,51,.3)}
  .case-card svg.case-svg{width:70px;height:70px;margin-bottom:8px}
  .case-card .case-name{font-size:12px;font-weight:800;margin-bottom:5px;line-height:1.2}
  .case-card .case-price{color:var(--red);font-size:14px;font-weight:900}
  
  .cat-tabs{display:flex;gap:8px;margin-bottom:15px;overflow-x:auto;padding-bottom:5px}
  .cat-tabs button{background:#111;border:1px solid #333;color:#888;padding:8px 15px;
    border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.2s}
  .cat-tabs button.active{background:var(--red);color:#000;border-color:var(--red)}

  /* ROULETTE */
  .opening-stage{margin-top:20px;display:none}
  .opening-stage.active{display:block}
  .roulette-wrapper{position:relative;background:#050505;border:2px solid var(--red);
    border-radius:12px;overflow:hidden;height:140px;box-shadow:0 0 40px rgba(255,0,51,.2) inset}
  .roulette{display:flex;height:100%;will-change:transform}
  .roulette-item{min-width:120px;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.05);
    flex-shrink:0;position:relative}
  .roulette-item svg{width:70px;height:70px}
  .roulette-item .item-name{font-size:9px;margin-top:5px;text-align:center;padding:0 5px;color:#ccc}
  .roulette-item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--rarity)}
  .pointer{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--red);
    transform:translateX(-50%);z-index:10;box-shadow:0 0 15px var(--red)}
  .pointer::before,.pointer::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent}
  .pointer::before{top:0;border-top:12px solid var(--red)}
  .pointer::after{bottom:0;border-bottom:12px solid var(--red)}

  .r-common{--rarity:var(--common)} .r-uncommon{--rarity:var(--uncommon)}
  .r-rare{--rarity:var(--rare)} .r-epic{--rarity:var(--epic)} .r-legend{--rarity:var(--legend)}

  /* RESULT */
  .result{text-align:center;padding:20px;border:2px solid var(--rarity,#ff0033);
    border-radius:12px;background:rgba(255,0,51,.05);margin-top:20px;animation:pop .4s}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .result svg{width:130px;height:130px;filter:drop-shadow(0 0 20px var(--rarity))}
  .result .big-name{font-size:18px;font-weight:900;margin:10px 0;color:var(--rarity)}
  .result .big-price{color:#fff;font-size:18px;font-weight:900;margin-bottom:15px}

  /* BUTTONS */
  .btn{background:var(--red);color:#000;border:none;padding:14px 24px;font-size:15px;
    font-weight:900;letter-spacing:1px;cursor:pointer;border-radius:10px;
    text-transform:uppercase;transition:all .15s;box-shadow:0 0 15px rgba(255,0,51,.4);width:100%}
  .btn:active{transform:scale(.95)}
  .btn:disabled{background:#222;color:#555;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--red);border:2px solid var(--red);box-shadow:none}
  .btn.small{padding:10px 15px;font-size:12px;width:auto}

  /* INVENTORY */
  .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
  .inv-item{background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:10px;
    text-align:center;position:relative;transition:all .15s;cursor:pointer;overflow:hidden}
  .inv-item:active{transform:scale(.95)}
  .inv-item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--rarity)}
  .inv-item svg{width:60px;height:60px}
  .inv-item .ii-name{font-size:10px;margin:5px 0;color:#ccc;line-height:1.1;height:22px;overflow:hidden}
  .inv-item .ii-price{color:var(--red);font-weight:900;font-size:12px}

  /* CALENDAR & RATING */
  .calendar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .day-card{background:#111;border:1px solid #222;border-radius:10px;padding:15px 5px;text-align:center;position:relative}
  .day-card.claimed{border-color:var(--red);background:rgba(255,0,51,.1)}
  .day-card.claimed::after{content:'✓';position:absolute;top:5px;right:5px;color:var(--red);font-weight:900}
  .day-card .d-num{font-size:10px;color:#888;margin-bottom:5px}
  .day-card .d-reward{font-size:14px;font-weight:900;color:#ffd700}
  
  .rating-item{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #222;
    border-radius:10px;padding:10px 15px;margin-bottom:8px}
  .r-rank{font-size:16px;font-weight:900;color:var(--red);width:20px}
  .r-name{flex:1;font-size:14px;font-weight:700}
  .r-score{font-size:12px;color:#ffd700;font-weight:900}

  /* SETTINGS & PROMO */
  .setting-row{display:flex;flex-direction:column;gap:10px;
    padding:15px;background:#0d0d0d;border:1px solid #222;border-radius:10px;margin-bottom:10px}
  .setting-header{display:flex;justify-content:space-between;align-items:center}
  .setting-row .s-label{font-size:14px;font-weight:700}
  .setting-row .s-val{color:var(--red);font-weight:900}
  input[type=range]{-webkit-appearance:none;width:100%;background:transparent;height:24px}
  input[type=range]::-webkit-slider-runnable-track{width:100%;height:6px;cursor:pointer;background:#222;border-radius:3px}
  input[type=range]::-webkit-slider-thumb{height:18px;width:18px;border-radius:50%;background:var(--red);cursor:pointer;-webkit-appearance:none;margin-top:-6px;box-shadow:0 0 10px var(--red)}
  
  .promo-box{display:flex;gap:10px;margin-top:10px}
  .promo-box input{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 15px;font-size:14px;outline:none}
  .promo-box input:focus{border-color:var(--red)}
  .promo-box button{width:auto;padding:10px 20px;font-size:14px}

  .toggle{width:46px;height:24px;background:#2a2a2a;border-radius:12px;position:relative;
    cursor:pointer;transition:.2s}
  .toggle.on{background:var(--red);box-shadow:0 0 10px rgba(255,0,51,.4)}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
    background:#fff;border-radius:50%;transition:.2s}
  .toggle.on::after{left:24px}

  .toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--red);color:#000;padding:12px 20px;border-radius:8px;font-weight:900;
    z-index:999;opacity:0;transition:.3s;font-size:13px;text-align:center;width:90%;max-width:300px}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="splash-screen">
  <div class="splash-logo">RED<span>CASE</span></div>
  <div class="splash-text">НАЖМИ, ЧТОБЫ ИГРАТЬ</div>
</div>

<header>
  <div class="logo">RED<span>CASE</span></div>
  <div class="user-info">
    <div class="lvl-box" id="lvlDisplay">LVL 1</div>
    <div class="balance" id="balance">1 000</div>
  </div>
</header>

<!-- CASES -->
<div class="page active" id="page-cases">
  <h2>Выбирай <span>Кейс</span></h2>
  <div class="cat-tabs" id="catTabs">
    <button class="active" data-cat="all">Все</button>
    <button data-cat="pistols">Пистолеты</button>
    <button data-cat="rifles">Автоматы</button>
    <button data-cat="knives">Ножи</button>
    <button data-cat="sets">Перчатки</button>
  </div>
  <div class="cases-grid" id="casesGrid"></div>
  
  <div class="opening-stage" id="openingArea">
    <h2 id="openingTitle" style="margin-top:20px"></h2>
    <div class="roulette-wrapper">
      <div class="pointer"></div>
      <div class="roulette" id="roulette"></div>
    </div>
    <div style="margin-top:15px;display:flex;gap:10px">
      <button class="btn" id="openBtn">ОТКРЫТЬ</button>
      <button class="btn ghost" id="backBtn" style="width:40%">НАЗАД</button>
    </div>
    <div id="resultArea"></div>
  </div>
</div>

<!-- BONUSES -->
<div class="page" id="page-bonus">
  <h2>Календарь <span>Наград</span></h2>
  <div class="calendar-grid" id="calendarGrid"></div>
  <button class="btn" id="claimDayBtn">ЗАБРАТЬ ЗА ДЕНЬ <span id="currentDayNum"></span></button>
  
  <h2 style="margin-top:30px">Топ <span>Игроков</span></h2>
  <div id="leaderboard"></div>
</div>

<!-- INVENTORY -->
<div class="page" id="page-inventory">
  <h2>Твой <span>инвентарь</span></h2>
  <button class="btn ghost small" id="sellAllBtn" style="float:right;margin-bottom:15px">ПРОДАТЬ ВСЁ</button>
  <div style="clear:both"></div>
  <div class="inv-grid" id="invGrid"></div>
  <div style="text-align:center;color:#555;padding:40px;display:none" id="invEmpty">Инвентарь пуст</div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <h2>Настройки</h2>
  
  <div class="setting-row">
    <div class="setting-header">
      <div class="s-label">Громкость музыки</div>
      <div class="s-val" id="volVal">40%</div>
    </div>
    <input type="range" id="volRange" min="0" max="100" value="40">
  </div>

  <div class="setting-row" style="flex-direction:row;justify-content:space-between;align-items:center">
    <div class="s-label">Звуки в игре</div>
    <div class="toggle on" id="tglSound"></div>
  </div>
  
  <div class="setting-row" style="flex-direction:row;justify-content:space-between;align-items:center">
    <div class="s-label">Быстрая анимация</div>
    <div class="toggle" id="tglFast"></div>
  </div>

  <div class="setting-row" style="border-color:#ffd700">
    <div class="s-label" style="color:#ffd700">Промокод</div>
    <div class="promo-box">
      <input type="text" id="promoInput" placeholder="Введи код...">
      <button class="btn" onclick="claimPromo()">ВЗЯТЬ</button>
    </div>
  </div>
  
  <div class="setting-row" style="flex-direction:row;justify-content:space-between;align-items:center;border-color:var(--red)">
    <div class="s-label" style="color:var(--red)">Сбросить прогресс</div>
    <button class="btn ghost small" id="resetBtn">СБРОС</button>
  </div>
</div>

<nav>
  <button class="active" data-page="cases">
    <svg viewBox="0 0 24 24"><path d="M21 8V21H3V8H21M21 3H3V6H21V3Z"/></svg> Кейсы
  </button>
  <button data-page="bonus">
    <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg> Бонусы
  </button>
  <button data-page="inventory">
    <svg viewBox="0 0 24 24"><path d="M20 6H4V8H20V6M20 10H4V12H20V10M20 14H4V16H20V14M20 18H4V20H20V18Z"/></svg> Скины
  </button>
  <button data-page="settings">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg> Настройки
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ================= СЛОЖНЫЕ SVG МОДЕЛЬКИ ОРУЖИЯ ================= */
// Используем уникальные ID для каждого градиента, чтобы они не конфликтовали
let svgIdCounter = 0;
const SVG = {
  pistol: (c1,c2) => { 
    const id = 'p'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M15 40 L75 40 L75 52 L55 52 L50 70 L35 70 L42 52 L15 52 Z" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <rect x="72" y="42" width="12" height="8" fill="#222" stroke="#111"/>
    <rect x="40" y="52" width="6" height="10" fill="#333"/>
    <path d="M25 42 L35 42 L30 48 Z" fill="#555" opacity=".5"/></svg>`; 
  },
  rifle: (c1,c2) => { 
    const id = 'r'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect x="10" y="45" width="70" height="10" rx="2" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <rect x="78" y="42" width="18" height="16" rx="2" fill="#222" stroke="#111"/>
    <rect x="30" y="55" width="10" height="20" rx="2" fill="#333" stroke="#111"/>
    <path d="M48 38 L58 38 L62 45 L44 45 Z" fill="#222"/>
    <rect x="12" y="47" width="8" height="6" fill="#444"/>
    <path d="M20 48 L40 48" stroke="#fff" stroke-width="1" opacity=".3"/></svg>`; 
  },
  sniper: (c1,c2) => { 
    const id = 's'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect x="5" y="47" width="85" height="6" rx="1" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <rect x="20" y="38" width="22" height="9" rx="3" fill="#222" stroke="#111"/>
    <circle cx="31" cy="42.5" r="3" fill="#0ff" opacity=".6"/>
    <rect x="72" y="42" width="15" height="18" rx="2" fill="#222" stroke="#111"/>
    <path d="M42 53 L50 53 L52 68 L40 68 Z" fill="#333"/>
    <path d="M45 60 L48 60 L48 75 L45 75 Z" fill="#222"/></svg>`; 
  },
  knife: (c1,c2) => { 
    const id = 'k'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M15 85 L75 15 L85 25 L25 95 Z" fill="url(#${id})" stroke="#fff" stroke-width="1.5"/>
    <path d="M20 80 L40 60" stroke="#fff" stroke-width="1" opacity=".4"/>
    <path d="M15 85 L25 95 L35 85 L25 80 Z" fill="#222" stroke="#111"/>
    <circle cx="80" cy="20" r="2" fill="#fff" opacity=".8"/></svg>`; 
  },
  karambit: (c1,c2) => { 
    const id = 'km'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M40 80 Q70 80 85 40 L90 45 Q75 95 40 90 Z" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <path d="M40 80 L50 80 L50 60 L40 60 Z" fill="#222" stroke="#111"/>
    <circle cx="45" cy="70" r="3" fill="#111"/>
    <path d="M85 40 L90 45" stroke="#fff" stroke-width="2"/></svg>`; 
  },
  gloves: (c1,c2) => { 
    const id = 'g'+(svgIdCounter++); 
    return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M25 55 L25 30 Q25 20 35 20 L40 20 Q45 20 45 30 L45 45 L50 45 L50 25 Q50 15 60 15 L65 15 Q70 15 70 25 L70 55 Q70 80 50 80 L35 80 Q25 80 25 65 Z" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <path d="M25 45 L10 35 Q5 30 10 25 L25 35 Z" fill="url(#${id})" stroke="#111" stroke-width="1.5"/>
    <path d="M35 50 L65 50" stroke="#111" stroke-width="1" opacity=".3"/>
    <path d="M40 30 L40 45" stroke="#111" stroke-width="1" opacity=".3"/></svg>`; 
  }
};

const CaseIcon = (type, c1, c2) => {
  let inner = SVG[type](c1, c2).replace(/<svg[^>]*>/, '').replace('</svg>', '');
  return `<svg class="case-svg" viewBox="0 0 100 100">${inner}</svg>`;

let state = {
  balance: 1000,
  inventory: [],
  level: 1,
  xp: 0,
  settings: {sound:true, fast:false, musicVol: 0.4},
  nextId: 1,
  lastDaily: 0,
  claimedDays: [],

};
function save() { localStorage.setItem('redcase_v3', JSON.stringify(state)); }
function load() {
  const s = localStorage.getItem('redcase_v3');
  if (s) { try { state = {...state, ...JSON.parse(s)}; } catch(e){} }
}
load();

/* ================= ЗВУКИ ================= */
let audioCtx = null;
function beep(freq=440, dur=0.05, type='sine', vol=0.1) {
  if (!state.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e){}
}

/* ================= МУЗЫКА & SPLASH ================= */
const music = document.getElementById('bg-music');
const splash = document.getElementById('splash-screen');
splash.addEventListener('click', () => {
  music.volume = state.settings.musicVol;
  music.play().catch(e => console.log('Ошибка аудио:', e));
  splash.style.opacity = '0';
  setTimeout(() => { splash.style.display = 'none'; }, 500);
});

/* ================= ХЕЛПЕРЫ ================= */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2000);
}
function updateBalance() {
  document.getElementById('balance').textContent = state.balance.toLocaleString('ru-RU');
  document.getElementById('lvlDisplay').textContent = 'LVL ' + state.level;
}
function getRandomRarity(pool) {
  const r = Math.random() * 100;
  if (pool.includes('legend') && r < 1.5) return 'legend';
  if (pool.includes('epic') && r < 5) return 'epic';
  if (pool.includes('rare') && r < 15) return 'rare';
  if (pool.includes('uncommon') && r < 40) return 'uncommon';
  return 'common';
}
function createSkin(pool) {
  const rar = getRandomRarity(pool);
  const list = SKINS_DB[rar];
  const base = list[Math.floor(Math.random() * list.length)];
  return { id: state.nextId++, name: base.n, rarity: rar, price: base.b, svg: SVG[base.t](base.c[0], base.c[1]) };
}

/* ================= РЕНДЕР КЕЙСОВ ================= */
function renderCases(filter='all') {
  const g = document.getElementById('casesGrid');
  g.innerHTML = '';
  CASES.filter(c => filter === 'all' || c.cat === filter).forEach(c => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `
      ${CaseIcon(c.icon, c.c[0], c.c[1])}
      <div class="case-name">${c.name}</div>
      <div class="case-price">${c.price} ₽</div>
    `;
    card.onclick = () => startOpening(c);
    g.appendChild(card);
  });
}
document.querySelectorAll('#catTabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#catTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCases(btn.dataset.cat);
  };
});

/* ================= ОТКРЫТИЕ ================= */
let isOpening = false;
function startOpening(c) {
  if (state.balance < c.price) { toast('Мало денег!'); return; }
  state.balance -= c.price;
  updateBalance(); save();

  document.getElementById('casesGrid').style.display = 'none';
  document.getElementById('catTabs').style.display = 'none';
  document.getElementById('openingArea').classList.add('active');
  document.getElementById('openingTitle').textContent = c.name;
  document.getElementById('resultArea').innerHTML = '';
  
  const rl = document.getElementById('roulette');
  rl.innerHTML = ''; rl.style.transition = 'none'; rl.style.transform = 'translateX(0)';
  
  const winSkin = createSkin(c.pool);
  const items = [];
  for (let i = 0; i < 60; i++) {
    items.push(i === 55 ? { skin: winSkin, rar: winSkin.rarity } : (() => { const s = createSkin(c.pool); return {skin:s, rar:s.rarity}; })());
  }
  
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'roulette-item r-' + it.rar;
    div.innerHTML = `${it.skin.svg}<div class="item-name">${it.skin.name}</div>`;
    rl.appendChild(div);
  });
  
  setTimeout(() => {
    const wrapperW = rl.parentElement.clientWidth;
    rl.style.transition = `transform ${state.settings.fast ? 2 : 5}s cubic-bezier(0.15, 0.9, 0.25, 1)`;
    rl.style.transform = `translateX(${-(55 * 120 + 60 - wrapperW / 2)}px)`;
    
    let t = 0;
    const int = setInterval(() => { beep(800, 0.02, 'square', 0.03); t++; if(t>30) clearInterval(int); }, 150);
    setTimeout(() => finishOpening(winSkin), state.settings.fast ? 2000 : 5000);
  }, 50);
}

function finishOpening(skin) {
  isOpening = false;
  state.inventory.push(skin);
  state.xp += 10;
  if (state.xp >= state.level * 50) { state.level++; state.xp = 0; toast('НОВЫЙ УРОВЕНЬ!'); }
  updateBalance(); save();
  
  beep(800, 0.2, 'sine', 0.2); setTimeout(()=>beep(1000, 0.3, 'sine', 0.2), 100);
  
  document.getElementById('resultArea').innerHTML = `
    <div class="result r-${skin.rarity}">
      ${skin.svg}
      <div class="big-name">${skin.name}</div>
      <div class="big-price">${skin.price} ₽</div>
      <button class="btn" onclick="closeResult()">ЗАБРАТЬ</button>
    </div>
  `;
  renderInventory();
}

function closeResult() {
  document.getElementById('openingArea').classList.remove('active');
  document.getElementById('casesGrid').style.display = 'grid';
  document.getElementById('catTabs').style.display = 'flex';
  document.getElementById('resultArea').innerHTML = '';
}
document.getElementById('backBtn').onclick = () => { if (!isOpening) closeResult(); };

/* ================= ИНВЕНТАРЬ ================= */
function renderInventory() {
  const g = document.getElementById('invGrid');
  const empty = document.getElementById('invEmpty');
  g.innerHTML = '';
  if (state.inventory.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  
  state.inventory.forEach(s => {
    const card = document.createElement('div');
    card.className = 'inv-item r-' + s.rarity;
    card.innerHTML = `${s.svg}<div class="ii-name">${s.name}</div><div class="ii-price">${s.price} ₽</div>`;
    card.onclick = () => {
      if(confirm(`Продать ${s.name} за ${s.price}₽?`)) {
        state.balance += s.price;
        state.inventory = state.inventory.filter(x => x.id !== s.id);
        updateBalance(); save(); renderInventory(); beep(1000, 0.1);
      }
    };
    g.appendChild(card);
  });
}
document.getElementById('sellAllBtn').onclick = () => {
  if (state.inventory.length === 0) return;
  if (!confirm('Продать ВСЁ?')) return;
  const total = state.inventory.reduce((a,b)=>a+b.price, 0);
  state.balance += total; state.inventory = [];
  updateBalance(); save(); renderInventory(); toast(`+${total} ₽`);
};

/* ================= ПРОМОКОДЫ ================= */
const PROMOS = {
  'REDCASE':1000,'WELCOME':500,'CS2FAN':750,'GIVEAWAY':1500,'KNIFE':2000,
  'LUCKY':300,'START':200,'GGWP':400,'DADDY':5000,'MILLION':10000,
  'PROMO':100,'CASES':800,'DROP':600,'RICH':1200,'GLOVES':900,
  'AWP':700,'NEON':1100,'SHARK':600,'BLOOD':1300,'SECRET':5000
};
function claimPromo() {
  const inp = document.getElementById('promoInput');
  const code = inp.value.trim().toUpperCase();
  if (!code) return;
  if (state.usedPromos.includes(code)) { toast('Ты уже активировал этот код!'); return; }
  if (PROMOS[code]) {
    state.balance += PROMOS[code];
    state.usedPromos.push(code);
    updateBalance(); save();
    beep(1200, 0.2); setTimeout(()=>beep(1500, 0.3), 100);
    toast(`Промокод принят! +${PROMOS[code]}₽`);
    inp.value = '';
  } else {
    toast('Неверный промокод');
    inp.value = '';
  }
}

/* ================= КАЛЕНДАРЬ ================= */
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const rewards = [100, 200, 300, 500, 800, 1200, 2000];
  for (let i = 1; i <= 7; i++) {
    const div = document.createElement('div');
    div.className = 'day-card';
    if (state.claimedDays.includes(i)) div.classList.add('claimed');
    div.innerHTML = `<div class="d-num">День ${i}</div><div class="d-reward">${rewards[i-1]}₽</div>`;
    grid.appendChild(div);
  }
  
  const nextDay = state.claimedDays.length + 1;
  const btn = document.getElementById('claimDayBtn');
  const num = document.getElementById('currentDayNum');
  if (nextDay > 7) {
    btn.disabled = true; btn.textContent = 'ВСЁ СОБРАНО';
  } else {
    btn.disabled = false;
    num.textContent = nextDay;
    btn.innerHTML = `ЗАБРАТЬ ЗА ДЕНЬ <span id="currentDayNum">${nextDay}</span>`;
  }
}
document.getElementById('claimDayBtn').onclick = () => {
  const nextDay = state.claimedDays.length + 1;
  if (nextDay > 7) return;
  const rewards = [100, 200, 300, 500, 800, 1200, 2000];
  state.balance += rewards[nextDay - 1];
  state.claimedDays.push(nextDay);
  updateBalance(); save(); renderCalendar(); beep(1000, 0.2);
  toast(`День ${nextDay}: +${rewards[nextDay-1]}₽`);
};

/* ================= ТОП ИГРОКОВ ================= */
function renderLeaderboard() {
  const list = document.getElementById('leaderboard');
  const bots = [
    {n:'Vitaliy_CS', s:15000}, {n:'ShadowKiller', s:12500}, {n:'NoScopeKing', s:11000},
    {n:'xX_Dark_Xx', s:9800}, {n:'MegaLucky', s:8500}
  ];
  let html = '';
  bots.forEach((b, i) => {
    html += `<div class="rating-item"><div class="r-rank">#${i+1}</div><div class="r-name">${b.n}</div><div class="r-score">${b.s}₽</div></div>`;
  });
  
  const best = state.inventory.length > 0 ? Math.max(...state.inventory.map(x=>x.price)) : 0;
  html += `<div class="rating-item" style="border-color:var(--red);background:rgba(255,0,51,.1);margin-top:15px">
    <div class="r-rank">#?</div><div class="r-name">Ты (Лучший дроп)</div><div class="r-score">${best}₽</div>
  </div>`;
  list.innerHTML = html;
}

/* ================= НАВИГАЦИЯ ================= */
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

/* ================= НАСТРОЙКИ ================= */

const volVal = document.getElementById('volVal');
volRange.value = state.settings.musicVol * 100;

};
document.getElementById('tglFast').onclick = function() {
  state.settings.fast = !state.settings.fast;
  this.classList.toggle('on', state.settings.fast); save();
};
document.getElementById('resetBtn').onclick = () => {
  if(confirm('Удалить весь прогресс?')) { localStorage.removeItem('redcase_v3'); location.reload(); }
};

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
updateBalance();
renderCases();
renderInventory();
renderCalendar();
renderLeaderboard();
document.getElementById('tglSound').classList.toggle('on', state.settings.sound);
document.getElementById('tglFast').classList.toggle('on', state.settings.fast);
